name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  contract:
    name: Contract (fmt, clippy, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/vault
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - name: Install cargo-near CLI
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.23.0/cargo-near-installer.sh | sh
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  gateway:
    name: Gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

  sentinel:
    name: Sentinel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sentinel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements.lock
      - run: ruff check .
      - run: pytest -q

  frontend:
    name: Dashboard and simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npm ci && npx tsc --noEmit
        working-directory: simulation
